name: Release

# 打 tag（v1.2.3 之类）自动构建通用二进制（arm64 + Intel）并发布 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 注意：这里刻意不再 `brew install lame`。
      # Homebrew 的 libmp3lame 会带上构建机的 SDK minos（实测 macOS 26 上是 26.0），
      # 打进包里后在低于该版本的机器上 dlopen 必然失败，而 LameEncoder 的失败路径是
      # 「静默回落 M4A」——用户拿不到 MP3，界面还不报错，是最难排查的一类问题。
      # build_app.sh 现在会从 LAME 官方源码、以 -mmacosx-version-min 自己编译，
      # 并在打包末尾硬校验 dylib 与主程序的 minos，不达标直接失败。

      - name: Verify deployment target consistency
        run: |
          # 三处声明必须一致：Package.swift / build_app.sh / 这里的期望值
          PKG="$(grep -o '\.macOS(\.v[0-9]*)' Package.swift | grep -o '[0-9]*')"
          BASH_TARGET="$(grep -o 'MACOSX_DEPLOYMENT_TARGET=[0-9.]*' scripts/build_app.sh | head -1 | cut -d= -f2)"
          PLIST="$(grep -o '<key>LSMinimumSystemVersion</key><string>[0-9.]*</string>' scripts/build_app.sh | grep -o '[0-9.]*<' | tr -d '<')"
          echo "Package.swift v$PKG / build_app.sh $BASH_TARGET / plist $PLIST"
          [ "$PKG" = "12" ] && [ "$BASH_TARGET" = "12.0" ] && [ "$PLIST" = "12.0" ] \
            || { echo "错误：最低版本声明不一致" >&2; exit 1; }

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 显式导出，确保 universal 两次单架构编译都继承同一目标版本
          export MACOSX_DEPLOYMENT_TARGET=12.0
          UNIVERSAL=1 APP_VERSION="$VERSION" bash scripts/build_app.sh

      # 把产物里的真实 minos 打印到日志并断言，避免「声明 12 实际更高」的静默漂移
      - name: Verify built artifact minos
        run: |
          APP="build/.dist/乐府.app"
          for f in "$APP/Contents/MacOS/乐府" "$APP/Contents/Frameworks/libmp3lame.0.dylib"; do
            M="$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
            echo "$(basename "$f"): minos=$M"
            NEWER="$(printf '%s\n%s\n' "12.0" "$M" | sort -V | tail -1)"
            if [ "$M" != "12.0" ] && [ "$NEWER" = "$M" ]; then
              echo "错误：$(basename "$f") 的 minos=$M 高于 12.0" >&2
              exit 1
            fi
          done
          echo "两个二进制的 minos 均 <= 12.0 ✓"

      - name: Zip app
        run: |
          cd build/.dist
          ditto -c -k --keepParent 乐府.app "Lefu-${GITHUB_REF_NAME}.zip"
          # 归档后挪出隐藏目录：action-gh-release 的 glob 默认不匹配点开头的目录
          mv "Lefu-${GITHUB_REF_NAME}.zip" ..

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Lefu-*.zip
          generate_release_notes: true

      # 把 Homebrew tap (boxter007/homebrew-lefu) 同步到本次发布的版本。
      # 之前靠手工同步，结果 tap 落后了一个版本（cask 停在 1.0.0 而 release 已到 1.0.1），
      # 故做成发布流程的一步。
      #
      # 需要配置仓库 Secret `TAP_TOKEN`：一个对 homebrew-lefu 有 contents:write 的
      # fine-grained PAT。未配置则本步打印提示后跳过（此时可本地跑 scripts/bump_cask.sh）。
      # 注意不要在 `if` 里读 secrets（上下文不可靠），统一在 run 里判空。
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "未配置 TAP_TOKEN，跳过 tap 自动升级。"
            echo "如需手动同步：bash scripts/bump_cask.sh ${GITHUB_REF_NAME} --zip build/Lefu-${GITHUB_REF_NAME}.zip"
            exit 0
          fi
          bash scripts/bump_cask.sh "${GITHUB_REF_NAME}" --zip "build/Lefu-${GITHUB_REF_NAME}.zip"
