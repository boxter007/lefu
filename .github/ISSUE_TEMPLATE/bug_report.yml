name: 报告 Bug
description: 记录一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        报 Bug 前请先看一眼 [FAQ](https://github.com/boxter007/lefu#常见问题faq) 和 [已知限制](https://github.com/boxter007/lefu#已知限制)，部分现象是设计取舍而非缺陷。
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 14.5 / Apple Silicon M2
    validations:
      required: true
  - type: input
    id: soda
    attributes:
      label: 汽水音乐版本
      placeholder: 例如 3.2.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 建好「乐府 通道」多输出设备
        2. 开始播放…
        3. 切歌时…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有报错日志或截图请一并贴上
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 采诗通道状态
      options:
        - 已连接（绿灯）
        - 未连接
        - 时而连接时而断开
    validations:
      required: false
