name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 先说清你处在什么场景下、想解决什么问题，再说希望怎么做
      placeholder: 我在整理现场录音时…，希望乐府能…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代方案是什么
      description: 你目前是怎么绕过这个问题的？这能帮我们判断优先级
    validations:
      required: false
